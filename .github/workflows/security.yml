name: Security Scan

on:
  push:
    branches:
      - main
      - bigtree
      - '**'
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Run Gitleaks
        id: scan
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact --report-format sarif --report-path "$RUNNER_TEMP/results.sarif" --log-level info .
          status=$?
          if [ -s "$RUNNER_TEMP/results.sarif" ]; then
            echo "report_generated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload SARIF report
        if: ${{ always() && steps.scan.outputs.report_generated == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/results.sarif
